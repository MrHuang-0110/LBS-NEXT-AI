            - name: python -u "..\..\tools\mdk_deploy_prompt.py" "#L"
              abortAfterFailed: true
              command: python -u "..\..\tools\mdk_deploy_prompt.py" "${KEIL_OUTPUT_DIR}\${ProjectName}.axf"
